[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effiped-multi-camera-tracking"
version = "1.0.0"
description = "Joint ConvNeXt V2 pedestrian detection, tracking, and cross-camera identity review."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aswanth Raj", email = "aswanthraj.public@gmail.com" }]
keywords = ["computer-vision", "multi-object-tracking", "person-reidentification", "pytorch"]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "scipy>=1.13",
  "lap>=0.5.12",
  "torchmetrics>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
runtime = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "opencv-python>=4.10",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
effiped-app = "effiped.cli:app"
effiped-train = "effiped.cli:train"
effiped-eval = "effiped.cli:evaluate"
effiped-demo = "effiped.cli:demo"

[project.urls]
Homepage = "https://effiped-multi-camera-tracking.vercel.app"
Repository = "https://github.com/aswanth-07/effiped-multi-camera-tracking"
Research = "https://github.com/aswanth-07/boxjde-person-search"

[tool.setuptools]
include-package-data = true
packages = ["effiped", "effiped.models", "effiped.tracking", "apps", "apps.api"]
package-dir = { effiped = "src/effiped", "effiped.models" = "src/effiped/models", "effiped.tracking" = "src/effiped/tracking", apps = "apps", "apps.api" = "apps/api" }

[tool.setuptools.package-data]
effiped = ["model_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["src/effiped/train.py", "src/effiped/dataset.py", "src/effiped/loss.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
